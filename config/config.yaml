# Project Configuration

project:
  name: "California Housing Price Prediction"
  version: "1.0.0"

mlflow:
  experiment_name: "House_Price_Prediction"
  model_name: "California_Housing_Predictor"
  alias: "staging"
  tracking_uri: null 

data:
  test_size: 0.2
  random_state: 42

experiments:
  - run_name: "Run 1"
    algorithm: "GradientBoosting"
    feature_engineering: false
    max_depth: 3
    learning_rate: 0.1
  - run_name: "Run 2"
    algorithm: "GradientBoosting"
    feature_engineering: false
    max_depth: 5
    learning_rate: 0.05
  - run_name: "Run 3"
    algorithm: "GradientBoosting"
    feature_engineering: false
    max_depth: 7
    learning_rate: 0.01

  - run_name: "Run 4 (Optimized)"
    algorithm: "HistGradientBoosting"
    feature_engineering: true
    learning_rate: 0.06
    max_iter: 350
    min_samples_leaf: 20
    l2_regularization: 0.5

serving:
  host: "0.0.0.0"
  port: 8000
  model_path: "./model"
